name: Interface do Zera APS
on:
  pull_request:
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'data/**'
      - 'tests/**'
      - '.github/workflows/interface.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/test_ui.py
        env:
          ZERA_REVIEW_DIR: review
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-screenshots
          path: review/*.png
          retention-days: 7
